# Not generated by Upptime. Upptime only checks for "status":"OK" in metrics.json, so a
# stopped metrics timer on the server would keep the last OK forever. This job opens an
# issue when the snapshot is older than MAX_AGE seconds and closes it when it is fresh again.
# If the endpoint is unreachable, the Upptime check "Server health" already opens an issue.
name: Metrics freshness
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: metrics-freshness
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: https://next.ieb.net/status/metrics.json
      MAX_AGE: "300"
      LABEL: stale-metrics
      ASSIGNEES: DaMo86,meerestier
    steps:
      - name: Check the age of metrics.json
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 --retry 2 "$URL" || true)"
          ts="$(jq -r '.ts // empty' <<<"$body" 2>/dev/null || true)"
          if [ -z "$ts" ]; then
            echo "No metrics JSON (endpoint down or not JSON); the Upptime check covers this."
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s) ))
          open="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')"
          if [ "$age" -le "$MAX_AGE" ]; then
            echo "fresh: ${age}s old"
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Fresh again: metrics.json was ${age}s old at $(date -u +%FT%TZ)."
            fi
            exit 0
          fi
          echo "stale: ${age}s old (ts $ts)"
          if [ -z "$open" ]; then
            gh label create "$LABEL" --color d93f0b --description "metrics.json not updated" --force
            gh issue create --label "$LABEL" --assignee "$ASSIGNEES" \
              --title "Server health data is stale" \
              --body "$(printf '%s\n\n%s\n%s\n\n%s' \
                "\`$URL\` was ${age}s old at $(date -u +%FT%TZ) (ts \`$ts\`, limit ${MAX_AGE}s)." \
                "The metrics timer on the server is probably not running." \
                "Check: \`systemctl status next-metrics.timer\`, \`journalctl -u next-metrics.service\`." \
                "This issue closes automatically when the data is fresh again.")"
          fi

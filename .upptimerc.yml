# Upptime configuration: https://upptime.js.org/docs/configuration
# Server side: NEXT-Society/next.infra (role status writes /status/metrics.json).
owner: NEXT-Society
repo: next.status

sites:
  - name: Wiki
    url: https://next.ieb.net/s/society
  - name: Landing page
    url: https://nextsociety.ieb.net/
  # Thresholds (disk, memory, swap, containers) are evaluated on the server.
  # Anything but "status":"OK" (e.g. "WARN disk 91%") marks this check down and opens an issue.
  - name: Server health
    url: https://next.ieb.net/status/metrics.json
    __dangerous__body_down_if_text_missing: '"status":"OK"'

# Downtime issues are assigned to the maintainers (GitHub notifies them).
assignees:
  - DaMo86
  - meerestier

# Strict allowlist: no repository secrets are passed to the checks.
# Add NOTIFICATION_ZULIP_* here when the Zulip notification is set up.
secrets: []

user-agent: next-society-status

status-website:
  baseUrl: /next.status
  name: NEXT Society Status
  logoUrl: https://nextsociety.ieb.net/assets/img/logo.svg
  introTitle: "**NEXT Society** service status"
  introMessage: Availability of the wiki and the landing page, and the health of the server they run on. Checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Wiki
      href: https://next.ieb.net
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
